<style>body{font:13px system-ui;color:#615075;margin:8px}button{border:0;background:#7151cd;color:white;border-radius:8px;padding:10px 14px;cursor:pointer}code{display:block;margin:12px 0;overflow-wrap:anywhere}small{display:block;margin-top:10px;color:#998ba9}</style><code id="value">No deeplink configured</code><button id="open" disabled>Open via deeplink ↗</button><small id="status">Verification is recorded after opening.</small><script>let fields={};addEventListener('message',event=>{if(event.source!==parent)return;if(event.data.type==='navloom:context'){fields=event.data.fields;document.querySelector('#value').textContent=fields.deeplink||'No deeplink configured';document.querySelector('#open').disabled=!fields.deeplink;document.querySelector('#status').textContent=fields.verification?(fields.verification.matchesScreen?'Verified destination':'Opened; destination differs'):'Not yet verified';}if(event.data.type==='navloom:result')document.querySelector('#status').textContent='Result: '+event.data.result.status;});document.querySelector('#open').onclick=()=>parent.postMessage({type:'navloom:invoke',tool:'deeplink',input:{field:'deeplink'},requestId:crypto.randomUUID()},'*');</script>
